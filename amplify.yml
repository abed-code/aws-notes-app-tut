version: 1
backend:
  phases:
    build:
      commands:
        # npm ci fails because @aws-amplify/data-construct and
        # @aws-amplify/graphql-api-construct ship bundled deps that don't
        # match their own manifests; npm install tolerates this.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
